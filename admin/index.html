<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Басқару панелі | Тіл-Time</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  
  <script>
    window.CMS_MANUAL_INIT = true;
    
    document.addEventListener('DOMContentLoaded', () => {
      CMS.init({
        config: {
          load_config_file: false, // <--- ОТКЛЮЧАЕМ ПОИСК ВНЕШНЕГО config.yml
          backend: {
            name: 'github',
            repo: 'B07pvl/til-time-site',
            branch: 'main'
          },
          media_folder: 'uploads',
          public_folder: '/uploads',
          collections: [
            {
              name: 'materials',
              label: 'Оқу материалдары',
              folder: 'content/materials',
              create: true,
              slug: '{{slug}}',
              fields: [
                { label: 'Тақырыбы / Название', name: 'title', widget: 'string' },
                {
                  label: 'Бөлім / Раздел',
                  name: 'category',
                  widget: 'select',
                  options: [
                    'Жаңа сөздер',
                    'Аудио және бейне',
                    '«Тілашар» үйірмесі',
                    'Ата-аналарға кеңес',
                    'Кері байланыс',
                    'Педагогикалық Тәжірибием',
                    '«Адал азамат» біртұтас тәрбие'
                  ]
                },
                {
                  label: 'Жас мөлшері (тек 3-5 жас бөлімі үшін) / Возраст',
                  name: 'age',
                  widget: 'select',
                  required: false,
                  options: ['3 жас', '4 жас', '5 жас']
                },
                { label: 'Мазмұны / Описание или ссылка', name: 'body', widget: 'markdown', required: false },
                { label: 'Файл (PDF немесе Word)', name: 'file', widget: 'file', required: false },
                { label: 'Күні / Дата', name: 'date', widget: 'datetime' }
              ]
            }
          ]
        }
      });
    });
  </script>
</body>
</html>
