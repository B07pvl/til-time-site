<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Басқару панелі | Тіл-Time</title>
</head>
<body>
  <!-- Подключаем Sveltia CMS -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  
  <script>
    window.CMS_MANUAL_INIT = true;
    
    document.addEventListener('DOMContentLoaded', () => {
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'B07pvl/til-time-site',
            branch: 'main'
          },
          media_folder: 'uploads',
          public_folder: '/uploads',
          collections: [
            {
              name: 'materials',
              label: 'Оқу материалдары',
              folder: 'content/materials',
              create: true,
              slug: '{{slug}}',
              fields: [
                { label: 'Тақырыбы / Название', name: 'title', widget: 'string' },
                {
                  label: 'Бөлім / Раздел',
                  name: 'category',
                  widget: 'select',
                  options: [
                    'Жаңа сөздер',
                    'Аудио және бейне',
                    '«Тілашар» үйірмесі',
                    'Ата-аналарға кеңес',
                    'Педагогикалық Тәжірибием',
                    '«Адал азамат» біртұтас тәрбие',
                    'Педагогтерге әдістемелік көмек',
                    'Тәрбиешілерге',
                    'Кері байланыс'
                  ]
                },
                {
                  label: 'Педагогтерге подкатегориясы',
                  name: 'pedagog_subcategory',
                  widget: 'select',
                  required: false,
                  options: [
                    'Нормативтік құжаттар',
                    'Перспективалық жоспарлар',
                    'Ұйымдастырылған іс-әрекет үлгілері',
                    'Авторлық бағдарламалар',
                    'Интерактивті ойындар',
                    'Жасанды интеллект құралдары',
                    'Мониторинг және диагностика',
                    'Әдістемелік әзірлемелер',
                    'Тәжірибе алмасу'
                  ]
                },
                {
                  label: 'Тәрбиешілерге подкатегориясы',
                  name: 'educator_subcategory',
                  widget: 'select',
                  required: false,
                  options: [
                    'Ортаңғы топ (3 жас)',
                    'Ересек топ (4 жас)',
                    'Мектепалды топ (5 жас)',
                    'Күнделікті қолданылатын қазақша сөздер',
                    'Режимдік сәттердегі тілдік қарым-қатынас',
                    'Дидактикалық ойындар',
                    'Көрнекіліктер мен карточкалар',
                    'Жүктеуге арналған материалдар'
                  ]
                },
                {
                  label: 'Жас мөлшері (3-5 жас)',
                  name: 'age',
                  widget: 'select',
                  required: false,
                  options: ['3 жас', '4 жас', '5 жас']
                },
                { label: 'Мазмұны / Описание', name: 'body', widget: 'markdown', required: false },
                { label: 'Файл (PDF, Word)', name: 'file', widget: 'file', required: false },
                { label: 'Күні / Дата', name: 'date', widget: 'datetime' }
              ]
            },
            {
              name: 'feedback',
              label: 'Кері байланыс (Пікірлер мен сұрақтар)',
              folder: 'content/feedback',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              fields: [
                { label: 'Аты-жөні / Имя пользователя', name: 'author', widget: 'string' },
                { label: 'E-mail / Контакт', name: 'email', widget: 'string', required: false },
                { label: 'Хабарлама / Сообщение', name: 'message', widget: 'text' },
                { label: 'Күні / Дата', name: 'date', widget: 'datetime' },
                {
                  label: 'Статус ответа',
                  name: 'status',
                  widget: 'select',
                  options: ['Жаңа (Новое)', 'Жауап берілді (Отвечено)']
                },
                { label: 'Педагогтің жауабы / Ответ педагога', name: 'reply', widget: 'markdown', required: false }
              ]
            }
          ]
        }
      });
    });
  </script>
</body>
</html>
